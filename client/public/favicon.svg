<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Squabble mark: a bull bubble (calmly typing ...) vs a bear bubble (shouting !) -->
  <!-- Bear bubble -->
  <g>
    <circle cx="31" cy="7" r="4.5" fill="#E5534B"/>
    <circle cx="51" cy="7" r="4.5" fill="#E5534B"/>
    <path d="M46 31 L46 40 L55 31 Z" fill="#E5534B"/>
    <rect x="24" y="6" width="34" height="26" rx="9" fill="#E5534B"/>
    <rect x="44.5" y="10.5" width="3" height="10" rx="1.5" fill="#FFFFFF"/>
    <circle cx="46" cy="25" r="1.9" fill="#FFFFFF"/>
  </g>
  <!-- Bull bubble -->
  <g>
    <path d="M10 25 L6 15 L17 21 Z" fill="#1F6B4C"/>
    <path d="M36 25 L40 15 L29 21 Z" fill="#1F6B4C"/>
    <path d="M8 49 L8 57 L17 49 Z" fill="#2F9E6E"/>
    <rect x="6" y="24" width="34" height="26" rx="9" fill="#2F9E6E" stroke="#1F6B4C" stroke-width="1.5"/>
    <circle cx="16" cy="37" r="2.6" fill="#FFFFFF"/>
    <circle cx="23" cy="37" r="2.6" fill="#FFFFFF"/>
    <circle cx="30" cy="37" r="2.6" fill="#FFFFFF"/>
  </g>
</svg>
