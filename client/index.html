<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e1116">
  <script id="appearance-bootstrap">
    // Apply saved appearance before styles and React load, avoiding a theme flash.
    (function () {
      var theme = 'dark';
      var designTheme = 'classic';
      try {
        var storedTheme = window.localStorage.getItem('pt-theme');
        var storedDesign = window.localStorage.getItem('sq-design-theme');
        if (storedTheme === 'light' || storedTheme === 'dark') theme = storedTheme;
        if (['classic', 'arcade', 'comic', 'orbit'].indexOf(storedDesign) !== -1) {
          designTheme = storedDesign;
        }
      } catch (_) {
        // Storage can be unavailable in privacy mode; retain the default appearance.
      }
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.documentElement.dataset.designTheme = designTheme;
      document.documentElement.style.colorScheme = theme;
    }());
  </script>
  <link rel="icon" href="/favicon.svg">
  <title>吵股 Squabble</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
