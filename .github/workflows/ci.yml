name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  webapp:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: squabble_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d squabble_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint + stylelint + typecheck)
        run: npm run lint

      - name: Initialize isolated integration database
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -d squabble_test -v ON_ERROR_STOP=1 -f scripts/db/01_schema.sql
          for migration in scripts/db/{03,04,05,06,07,08,09,10,11,12,13,14}_*.sql; do
            psql -h localhost -U postgres -d squabble_test -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run server tests
        env:
          BUDGET_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
          COUNCIL_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/squabble_test
        run: npm run test:server

      - name: Run client tests
        run: npm run test:client

      - name: Run local agent bridge tests
        run: |
          npx tsc -p agent-bridge/tsconfig.json
          npm run test:a2a

  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run offline test suite
        run: uv run pytest -q

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build self-hosted image
        run: docker build .
