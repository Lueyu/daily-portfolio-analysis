name: Feature request
description: Suggest a new capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point before proposing the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: |
        Ideas that fit this project especially well: new analysis pipeline
        stages, verified data sources, paper risk rules, privacy controls,
        bilingual onboarding and simpler self-hosting.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
