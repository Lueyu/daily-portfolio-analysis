name: squabble-local

services:
  db:
    # Override for firewalled networks, e.g. via .env:
    #   DB_IMAGE=docker.m.daocloud.io/library/postgres:16-alpine
    image: ${DB_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    volumes:
      # The base schema is applied only when this local database is first created.
      - ./scripts/db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./scripts/db/03_agent_builder.sql:/docker-entrypoint-initdb.d/03_agent_builder.sql:ro
      - ./scripts/db/04_user_api_settings.sql:/docker-entrypoint-initdb.d/04_user_api_settings.sql:ro
      - dpa-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: ${SQUABBLE_APP_IMAGE:-ghcr.io/lueyu/squabble:stable}
    pull_policy: missing
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME:-squabble-local}
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      # Direct PostgreSQL connection (first-party, no platform layer).
      DATABASE_URL: "postgres://postgres:postgres@db:5432/portfolio"
      # Empty values are generated once in the persistent secrets volume.
      JWT_SECRET: ${JWT_SECRET:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      # Registration closes automatically after the first account is created.
      REGISTER_ENABLED: "first-user"
      # Optional: enable the /openapi/agent-gateway for the Python agent.
      AGENT_GATEWAY_ENABLED: "false"
      SQUABBLE_UPDATE_MODE: ${SQUABBLE_UPDATE_MODE:-docker}
      SQUABBLE_UPDATE_BACKUP_DIR: /app/.backups
      # AGENT_GATEWAY_TOKEN: "dev-agent-token-change-me"
      # Optional: LLM key for running real multi-agent analyses.
      # DOUBAO_API_KEY: ""
    ports:
      - "127.0.0.1:${HOST_APP_PORT:-3000}:3000"
    volumes:
      - settings-secrets:/app/.secrets
      - update-backups:/app/.backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  updater:
    image: containrrr/watchtower:1.6.0
    restart: unless-stopped
    command: ["--http-api-update", "--label-enable", "--scope", "${COMPOSE_PROJECT_NAME:-squabble-local}"]
    environment:
      WATCHTOWER_HTTP_API_TOKEN: /run/secrets/update-token
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - settings-secrets:/run/secrets:ro
    depends_on:
      app:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  dpa-data:
  settings-secrets:
  update-backups:
