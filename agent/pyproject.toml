[project]
name = "stock-agent"
version = "0.1.0"
description = "Model-agnostic Python agent for portfolio research and market analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.23",
  "openai>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "tenacity>=9.0",
  "rich>=13.7",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
]

[project.scripts]
agent = "agent_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
